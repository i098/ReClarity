name: Bug report
description: Report a problem in ReClarity
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Say what you ran and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Give the command and the target type. Do not attach a private build.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Bun version, bwrap version.
