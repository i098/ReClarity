<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d"><title id="t">BLA-hardened build vs ReClarity-cleaned copy</title><desc id="d">Side by side. Left, BLA-hardened: REA stops with a capacity error after 1.9 to 2.1 seconds, recall 0 of 3 facts, 783 tokens (the error text). Right, ReClarity-cleaned: REA runs again, 6.2 to 7.4 seconds plus 0.45 seconds to clean, recall 3 of 3 facts, 618,233 tokens. After the latest fold changes, a pair without the header flood gives 150,203 tokens against 138,099 for the plain app. Cost was not measured.</desc>
<style>
text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#1f2933;font-size:14px}
.m{fill:#616e7c;font-size:13px}.h{font-size:12px;font-weight:600;letter-spacing:.06em;fill:#616e7c}.ti{font-size:18px;font-weight:700}.v{font-size:22px;font-weight:700}
.p{fill:#8a94a0;fill-opacity:.1;stroke:#8a94a0;stroke-opacity:.45}
.L{fill:#d9822b}.R{fill:#0f9d8a}.tL{fill:#b3631a}.tR{fill:#0b7f70}
.b{transform-box:fill-box;transform-origin:left;animation:g 1.2s cubic-bezier(.2,.7,.2,1) both}
.f{animation:f .6s ease both}
@keyframes g{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes f{from{opacity:0}to{opacity:1}}
@media (prefers-color-scheme:dark){text{fill:#e4e7eb}.m,.h{fill:#9aa5b1}.tL{fill:#f0a35e}.tR{fill:#3ec9b4}}
@media (prefers-reduced-motion:reduce){.b,.f{animation:none}}
</style>
<rect class="p" x="20" y="20" width="420" height="340" rx="12"/>
<rect class="p" x="460" y="20" width="420" height="340" rx="12"/>
<rect class="L" x="20" y="20" width="420" height="5" rx="2.5"/>
<rect class="R" x="460" y="20" width="420" height="5" rx="2.5"/>
<text class="ti" x="44" y="62">BLA-hardened</text><text class="m" x="44" y="82">REA runs on the protected build</text>
<text class="ti" x="484" y="62">ReClarity-cleaned</text><text class="m" x="484" y="82">REA runs on the cleaned copy</text>

<text class="h" x="44" y="118">STATUS</text><text class="h" x="484" y="118">STATUS</text>
<g class="f" style="animation-delay:.2s"><text class="v tL" x="44" y="146">Capacity error</text><text class="m" x="44" y="166">ASAR header over 16 MiB. REA stops.</text></g>
<g class="f" style="animation-delay:.2s"><text class="v tR" x="484" y="146">ok</text><text class="m" x="484" y="166">REA runs again. Recall 3 of 3 facts.</text></g>

<text class="h" x="44" y="206">ANALYSIS TIME</text><text class="h" x="484" y="206">ANALYSIS TIME</text>
<rect class="b L" x="44" y="218" width="83" height="18" rx="4" style="animation-delay:.4s"/>
<text class="m f" x="136" y="232" style="animation-delay:1.4s">1.9–2.1 s, stopped early</text>
<rect class="b R" x="484" y="218" width="296" height="18" rx="4" style="animation-delay:.4s"/>
<text class="m f" x="484" y="256" style="animation-delay:1.4s">6.2–7.4 s, plus 0.45 s to clean</text>

<text class="h" x="44" y="296">EVIDENCE TOKENS</text><text class="h" x="484" y="296">EVIDENCE TOKENS</text>
<rect class="b L" x="44" y="308" width="3" height="18" rx="1.5" style="animation-delay:.6s"/>
<text class="m f" x="56" y="322" style="animation-delay:1.6s">783 (the error text)</text>
<rect class="b R" x="484" y="308" width="340" height="18" rx="4" style="animation-delay:.6s"/>
<text class="m f" x="484" y="346" style="animation-delay:1.6s">618,233</text>

<rect class="p" x="20" y="376" width="860" height="52" rx="12"/>
<g class="f" style="animation-delay:1.9s"><text x="44" y="398" style="font-weight:600">Latest fold, pair without header flood</text>
<text class="m" x="44" y="418">Cleaned 150,203 tokens vs 138,099 plain (1.09×). 115 vs 111 unknowns. Recall 3 of 3, no trap words.</text></g>
<text class="m" x="20" y="452">REA 6.8.0, BLA 3.1.0 bankrupt, 3 runs. Source: docs/proof.md. Cost not measured. Time not re-measured after the fold change.</text>
</svg>
